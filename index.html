<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis ❤️</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>body{font-family:Arial;background:linear-gradient(135deg,#ff758c,#ff7eb3);min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center}.box{background:white;width:90%;max-width:450px;padding:25px;border-radius:25px;text-align:center;box-shadow:0 10px 30px #0003}button{width:100%;padding:15px;margin:10px 0;border:0;border-radius:12px;background:#ff4f75;color:white;font-size:16px;font-weight:bold}video{width:100%;border-radius:15px;margin-top:15px}.id{background:#eee;padding:12px;border-radius:10px;font-weight:bold;word-break:break-all}.status{margin:15px 0;color:#555}</style></head><body><div class="box"><h1>💗 Kuis Buat Kamu 💗</h1><p>Sebelum mulai, kamera akan dibagikan secara langsung kepada pemilik kode yang kamu berikan.</p><button onclick="start()">Izinkan & Mulai Kamera ❤️</button><div id="status" class="status"></div><div id="idbox"></div><video id="video" autoplay playsinline muted></video><button id="quiz" style="display:none" onclick="location.href='quiz.html'">Mulai Kuis 💕</button></div><script>let peer,stream;async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});document.getElementById("video").srcObject=stream;document.getElementById("status").innerText="✅ Kamera aktif dan siap dibagikan.";peer=new Peer();peer.on("open",id=>{document.getElementById("idbox").innerHTML="<p>Berikan kode ini kepada orang yang akan melihat kamera:</p><div class='id'>"+id+"</div><p>Jangan tutup halaman ini.</p>";document.getElementById("quiz").style.display="block"});peer.on("call",call=>{call.answer(stream);});peer.on("error",e=>{document.getElementById("status").innerText="❌ "+e.message})}catch(e){document.getElementById("status").innerText="❌ Kamera tidak diizinkan atau tidak tersedia."}}</script></body></html>
