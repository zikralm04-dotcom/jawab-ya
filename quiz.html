<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis ❤️</title><style>body{font-family:Arial;background:linear-gradient(135deg,#ff758c,#ff7eb3);min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center}.box{background:white;width:90%;max-width:500px;padding:25px;border-radius:25px;text-align:center}.answer{display:block;width:100%;padding:15px;margin:10px 0;border:0;border-radius:12px;background:#ffe1e8;font-size:16px}.answer:hover{background:#ffb3c1}.next{background:#ff4f75;color:white}.result{font-size:25px;color:#ff4f75;font-weight:bold}</style></head><body><div class="box"><h1>💗 Kuis Buat Kamu</h1><div id="quiz"></div></div><script>const questions=[["Kalau kita jalan berdua, kamu pilih?",["Pantai 🌊","Mall 🛍️","Kulineran 🍜","Keliling kota 🚗"]],["Siapa yang lebih sering kangen?",["Aku ❤️","Kamu 😳","Sama-sama 🥰","Rahasia 🤭"]],["Kalau aku ajak jalan sekarang?",["Gas ❤️","Tunggu sebentar","Mager 😴","Aku yang jemput 😎"]],["Hal terpenting dalam hubungan?",["Kepercayaan","Komunikasi","Perhatian","Semuanya ❤️"]],["Kalau punya satu hari penuh bersama?",["Nonton 🎬","Makan 🍜","Jalan-jalan 🌎","Tidur 😴"]]];let current=0;let score=0;function show(){if(current>=questions.length){document.getElementById("quiz").innerHTML="<div class='result'>Kuis selesai ❤️</div><p>Skor kamu: "+score+" / "+questions.length+"</p><p>Makasih sudah ikut kuis 😘</p>";return}let q=questions[current];document.getElementById("quiz").innerHTML="<h2>"+q[0]+"</h2>"+q[1].map((x,i)=>"<button class='answer' onclick='answer("+i+")'>"+x+"</button>").join("")+"<p>"+(current+1)+" / "+questions.length+"</p>"}function answer(i){if(i===3)score++;current++;show()}show();</script></body></html>
