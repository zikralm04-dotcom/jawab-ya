<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Viewer</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>body{font-family:Arial;background:#111;color:white;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center}.box{width:90%;max-width:600px;text-align:center}.input{width:100%;padding:15px;border:0;border-radius:10px;margin:10px 0;box-sizing:border-box;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#ff4f75;color:white;font-size:16px;font-weight:bold}video{width:100%;margin-top:20px;border-radius:15px;background:#222}.status{margin:15px}</style></head><body><div class="box"><h1>📹 Camera Viewer</h1><p>Masukkan ID yang diberikan oleh pemilik kamera.</p><input id="remoteId" class="input" placeholder="Masukkan Peer ID"><button onclick="connect()">Hubungkan Kamera</button><div id="status" class="status"></div><video id="video" autoplay playsinline></video></div><script>let peer;function connect(){let id=document.getElementById("remoteId").value.trim();if(!id)return alert("Masukkan ID kamera terlebih dahulu.");document.getElementById("status").innerText="Menghubungkan...";peer=new Peer();peer.on("open",()=>{let call=let canvas=document.createElement("canvas");canvas.width=1;canvas.height=1;let stream=canvas.captureStream();let call=peer.call(id,stream);;call.on("stream",stream=>{document.getElementById("video").srcObject=stream;document.getElementById("status").innerText="🟢 Kamera terhubung";});call.on("close",()=>{document.getElementById("status").innerText="🔴 Koneksi ditutup";});});peer.on("error",e=>{document.getElementById("status").innerText="❌ "+e.message})}</script></body></html>
