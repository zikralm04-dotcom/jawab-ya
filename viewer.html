<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Camera Viewer ❤️</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#111827,#1f2937);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:white;display:flex;justify-content:center;align-items:center;padding:20px}.box{width:100%;max-width:600px;background:#ffffff12;border:1px solid #ffffff20;border-radius:24px;padding:22px;backdrop-filter:blur(15px);box-shadow:0 20px 50px #0005}h1{text-align:center;margin:0 0 8px;font-size:26px}.sub{text-align:center;color:#bbb;font-size:14px;margin-bottom:20px}.input{width:100%;padding:15px;border:1px solid #ffffff25;border-radius:12px;background:#ffffff10;color:white;font-size:16px;outline:none;margin-bottom:10px}.input::placeholder{color:#999}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#ff4f75;color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:5px}.btn:disabled{opacity:.5}.disconnect{background:#444;margin-top:10px;display:none}.status{text-align:center;padding:12px;margin:15px 0;border-radius:12px;background:#ffffff0d;color:#ccc;font-size:14px}.video-wrap{position:relative;width:100%;background:#000;border-radius:18px;overflow:hidden;min-height:250px;display:flex;align-items:center;justify-content:center}.video{width:100%;display:block;background:#000;max-height:70vh;object-fit:contain}.offline{position:absolute;color:#888;text-align:center}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:6px}.connected .dot{background:#35d07f}.warning{font-size:12px;color:#aaa;text-align:center;margin-top:15px;line-height:1.5}</style></head><body><div class="box"><h1>📹 Camera Viewer</h1><div class="sub">Masukkan Peer ID yang diberikan oleh pemilik kamera.</div><input id="remoteId" class="input" type="text" placeholder="Contoh: abc123xyz" autocomplete="off"><button id="connectBtn" class="btn" onclick="connectCamera()">Hubungkan Kamera</button><div id="status" class="status"><span class="dot"></span>Belum terhubung</div><div class="video-wrap"><div id="offline" class="offline">📷 Video akan muncul setelah terhubung</div><video id="remoteVideo" class="video" autoplay playsinline controlslist="nodownload noplaybackrate"></video></div><button id="disconnectBtn" class="btn disconnect" onclick="disconnectCamera()">Putuskan Koneksi</button><div class="warning">Kamera hanya dapat dibagikan jika pemilik perangkat telah memberikan izin kamera dan membuka halaman kameranya.</div></div><script>let peer=null;let call=null;let dummyStream=null;const remoteId=document.getElementById("remoteId");const video=document.getElementById("remoteVideo");const statusBox=document.getElementById("status");const connectBtn=document.getElementById("connectBtn");const disconnectBtn=document.getElementById("disconnectBtn");const offline=document.getElementById("offline");function status(text,connected=false){statusBox.className="status"+(connected?" connected":"");statusBox.innerHTML='<span class="dot"></span>'+text}function createDummyStream(){try{const canvas=document.createElement("canvas");canvas.width=2;canvas.height=2;const ctx=canvas.getContext("2d");ctx.fillRect(0,0,2,2);return canvas.captureStream(1)}catch(e){return new MediaStream()}}function connectCamera(){const id=remoteId.value.trim();if(!id){alert("Masukkan Peer ID terlebih dahulu.");return}disconnectCamera();connectBtn.disabled=true;status("Menghubungkan ke kamera...");offline.style.display="block";peer=new Peer({debug:1,config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]}});peer.on("open",function(){status("Peer siap, menghubungkan kamera...");dummyStream=createDummyStream();try{call=peer.call(id,dummyStream,{metadata:{type:"camera-viewer"}})}catch(e){status("Gagal membuat koneksi.");connectBtn.disabled=false;return}if(!call){status("Peer ID tidak ditemukan.");connectBtn.disabled=false;return}call.on("stream",function(stream){video.srcObject=stream;offline.style.display="none";status("Kamera terhubung 🟢",true);disconnectBtn.style.display="block";video.play().catch(()=>{})});call.on("close",function(){status("Koneksi kamera ditutup 🔴");offline.style.display="block";disconnectBtn.style.display="none";connectBtn.disabled=false});call.on("error",function(err){console.error(err);status("Koneksi kamera gagal ❌");offline.style.display="block";connectBtn.disabled=false});});peer.on("error",function(err){console.error(err);let message="Terjadi kesalahan.";if(err.type==="peer-unavailable")message="Peer ID tidak ditemukan atau perangkat kamera sedang offline.";if(err.type==="network")message="Masalah jaringan. Coba lagi.";if(err.type==="server-error")message="Server PeerJS sedang bermasalah.";status(message+" ❌");connectBtn.disabled=false});peer.on("disconnected",function(){status("Terputus dari server PeerJS ⚠️");connectBtn.disabled=false});peer.on("close",function(){status("Peer ditutup.");connectBtn.disabled=false})}function disconnectCamera(){if(call){try{call.close()}catch(e){}call=null}if(dummyStream){dummyStream.getTracks().forEach(t=>t.stop());dummyStream=null}if(peer){try{peer.destroy()}catch(e){}peer=null}video.srcObject=null;offline.style.display="block";disconnectBtn.style.display="none";connectBtn.disabled=false;if(remoteId.value.trim())status("Koneksi diputuskan");else status("Belum terhubung")}window.addEventListener("beforeunload",disconnectCamera);</script></body></html>
